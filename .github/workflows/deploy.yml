name: Deploy NodeJS application to Azure Linux VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY}}
          script: |
            cd /home/kutty/nodejs-application-deploy-gitHub-actions
            git pull
            docker compose up -d --build